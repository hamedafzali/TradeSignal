services:

  bot:
    build: .
    container_name: tradesignal-bot
    command: python bot.py
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - CHANNEL_ID=${CHANNEL_ID}
      - SYMBOLS=${SYMBOLS:-AAPL,TSLA,NVDA,MSFT,BTC-USD,ETH-USD}
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-5}
      - OUTCOME_CHECK_HOURS=${OUTCOME_CHECK_HOURS:-24}
    volumes:
      - .:/app                      # live code mount — git pull takes effect on restart
      - app_data:/app/data
      - model_cache:/app/.model_cache
    restart: unless-stopped

  dashboard:
    build: .
    container_name: tradesignal-dashboard
    command: python dashboard.py
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=5000
    ports:
      - "5002:5000"
    volumes:
      - .:/app
      - app_data:/app/data
    restart: unless-stopped

  # ── FinBERT sentiment sidecar ────────────────────────────────────────────────
  # Enable in dashboard: Admin → AI Sentiment Settings → Provider: Local FinBERT
  # First start downloads ~400MB model. Subsequent starts use the cached volume.
  finbert:
    build: ./sentiment_service
    container_name: tradesignal-finbert
    ports:
      - "5004:5001"
    volumes:
      - finbert_cache:/root/.cache/huggingface
    restart: unless-stopped
    environment:
      - PORT=5001

volumes:
  app_data:
  model_cache:
  finbert_cache:
